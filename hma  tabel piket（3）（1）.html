                <th>Menyapu</th>

            </tr>

            </tr>

               <th>Selasa</th>

            </tr>

                <th>rabu</th>
                <th>najwa</th>
                <th>jeni</th>
            </tr>
            <tr><!--Baris kelima-->
                <th>kamis</th>
                <th>desi</th>
                <th>mala</th>
            </tr>
            <tr><!--Baris-->
                <th>jum'at</th>

                <th>zahwa</th>
            </tr>
        </table>
    </body>
</html>
